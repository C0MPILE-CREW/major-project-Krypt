services:
  - type: web
    name: krypt-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: primary-backend
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      # Requests pass Cloudflare, then Render's proxy, before the app.
      - key: TRUST_PROXY_HOPS
        value: 2
      - key: DATABASE_URL
        fromDatabase:
          name: krypt-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: krypt-db
          property: connectionString

databases:
  - name: krypt-db
    plan: free
    region: oregon
    databaseName: db_name
    user: krypt

